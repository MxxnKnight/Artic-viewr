<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sticky diagnostic</title>
<style>
  body { margin: 0; background: #0A0F18; color: #fff; font-family: sans-serif; overflow-x: hidden; }
  .spacer { height: 130vh; display: flex; align-items: center; justify-content: center; color: #5A6B82; }
  .bar { position: sticky; top: 0; height: 56px; display: flex; align-items: center; justify-content: center;
         font-weight: bold; z-index: 30; font-size: 15px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fade { animation: fadeIn .3s ease; }
  .flexcol { display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var CASE = new URLSearchParams(location.search).get('case') || 'ALL';
  var cases = {
    A: { label: 'A: direct child of body', color: '#3b82f6',
         html: '<div class="bar" style="background:#3b82f6">A: direct child of body</div><div class="spacer">A spacer</div>' },
    B: { label: 'B: inside overflow-x:clip', color: '#22c55e',
         html: '<div style="overflow-x:clip"><div class="bar" style="background:#22c55e">B: inside overflow-x:clip</div><div class="spacer">B spacer</div></div>' },
    C: { label: 'C: inside overflow-x:hidden', color: '#ef4444',
         html: '<div style="overflow-x:hidden"><div class="bar" style="background:#ef4444">C: inside overflow-x:hidden</div><div class="spacer">C spacer</div></div>' },
    D: { label: 'D: inside plain wrapper', color: '#a855f7',
         html: '<div><div class="bar" style="background:#a855f7">D: inside plain wrapper</div><div class="spacer">D spacer</div></div>' },
    E: { label: 'E: inside fadeIn wrapper', color: '#f59e0b',
         html: '<div class="fade"><div class="bar" style="background:#f59e0b">E: inside fadeIn wrapper</div><div class="spacer">E spacer</div></div>' },
    F: { label: 'F: inside flex column', color: '#06b6d4',
         html: '<div class="flexcol"><div class="bar" style="background:#06b6d4">F: inside flex column</div><div class="spacer">F spacer</div></div>' },
    G: { label: 'G: toolbar chain (clip>flexcol>fade)', color: '#ec4899',
         html: '<div class="flexcol" style="overflow-x:clip"><div class="flexcol"><div class="fade"><div class="bar" style="background:#ec4899">G: toolbar chain</div><div class="spacer">G spacer</div></div></div></div>' },
    H: { label: 'H: flex column, NO overflow-x (proposed fix)', color: '#84cc16',
         html: '<div class="flexcol"><div class="bar" style="background:#84cc16">H: flexcol no overflow-x</div><div class="spacer">H spacer</div></div>' },
    I: { label: 'I: flexcol + overflow-x:clip (app root combo)', color: '#f472b6',
         html: '<div class="flexcol" style="overflow-x:clip"><div class="bar" style="background:#f472b6">I: flexcol+clip</div><div class="spacer">I spacer</div></div>' },
    J: { label: 'J: flexcol + clip + min-height:100dvh (exact app root)', color: '#fb923c',
         html: '<div class="flexcol" style="overflow-x:clip;min-height:100dvh"><div class="bar" style="background:#fb923c">J: exact app root</div><div class="spacer">J spacer</div></div>' }
  };
  var root = document.getElementById('root');
  if (CASE === 'ALL') {
    root.innerHTML = '<div class="spacer">scroll &darr;</div>' +
      Object.keys(cases).map(function (k) { return cases[k].html; }).join('');
  } else if (cases[CASE]) {
    document.title = 'sticky diagnostic ' + CASE;
    root.innerHTML = cases[CASE].html;
  } else {
    root.innerHTML = '<div class="spacer">unknown case</div>';
  }
</script>
</body>
</html>
